<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>もじへんしんランド - ABCDE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔤</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Rounded Mplus 1c", sans-serif;
  }
  body {
    background: linear-gradient(160deg, #ffe9f2 0%, #e6f3ff 45%, #e9fff0 100%);
    animation: bgshift 24s ease-in-out infinite alternate;
  }
  @keyframes bgshift {
    0%   { background: linear-gradient(160deg, #ffe9f2 0%, #e6f3ff 45%, #e9fff0 100%); }
    50%  { background: linear-gradient(160deg, #fff6e0 0%, #ffe9f2 45%, #e6f3ff 100%); }
    100% { background: linear-gradient(160deg, #e9fff0 0%, #fff6e0 45%, #ffe9f2 100%); }
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- オーバーレイUI ---------- */
  #ui { position: fixed; inset: 0; pointer-events: none; }

  .btn {
    pointer-events: auto;
    position: absolute;
    width: clamp(56px, 9vmin, 76px);
    height: clamp(56px, 9vmin, 76px);
    border: none; border-radius: 50%;
    background: rgba(255,255,255,0.88);
    box-shadow: 0 4px 14px rgba(120,110,180,0.25);
    font-size: clamp(28px, 4.6vmin, 40px);
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.88); }

  #homeBtn { top: calc(env(safe-area-inset-top, 0px) + 12px); left: calc(env(safe-area-inset-left, 0px) + 12px); display: none; }

  #nextBtn {
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    top: 50%;
    transform: translateY(-50%);
    display: none;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translateY(-50%) scale(1); }
    50%      { transform: translateY(-50%) scale(1.18); }
  }

  /* タイトル */
  #title {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 3.5vmin);
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(22px, 5.4vmin, 44px);
    font-weight: bold;
    color: #7a6ae0;
    text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(122,106,224,0.25);
    letter-spacing: 0.08em;
  }

  /* 変身したことばの表示 */
  #wordLabel {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 5vmin);
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(30px, 7.5vmin, 62px);
    font-weight: bold;
    color: #fff;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.2, 2.2, 0.4, 1);
    -webkit-text-stroke: 2px rgba(0,0,0,0.08);
    text-shadow: 0 3px 0 rgba(0,0,0,0.12), 0 6px 18px rgba(0,0,0,0.18);
    letter-spacing: 0.05em;
  }
  #wordLabel.show { opacity: 1; transform: scale(1); }

  /* あそびかたヒント(ゆびアイコン) */
  #hint {
    position: absolute;
    left: 50%; top: 62%;
    font-size: clamp(44px, 11vmin, 90px);
    opacity: 0;
    transition: opacity 0.5s ease;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
  }
  #hint.show { opacity: 0.95; }
  #hint.poke  { animation: hintPoke 1.0s ease-in-out infinite; }
  #hint.pull  { animation: hintPull 1.4s ease-in-out infinite; }
  #hint.spin  { animation: hintSpin 1.6s linear infinite; }
  @keyframes hintPoke {
    0%, 100% { transform: translate(-50%, 0) scale(1); }
    30%      { transform: translate(-50%, -26%) scale(0.92); }
    45%      { transform: translate(-50%, 4%) scale(1.05); }
  }
  @keyframes hintPull {
    0%, 100% { transform: translate(-110%, 0); }
    50%      { transform: translate(20%, 0); }
  }
  @keyframes hintSpin {
    from { transform: translate(-50%, 0) rotate(0deg); }
    to   { transform: translate(-50%, 0) rotate(360deg); }
  }

  /* できた!スター演出 */
  #star {
    position: absolute;
    left: 50%; top: 40%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(80px, 24vmin, 200px);
    filter: drop-shadow(0 6px 18px rgba(255,180,0,0.5));
    transition: transform 0.6s cubic-bezier(0.2, 2.4, 0.4, 1);
    pointer-events: none;
  }
  #star.show { transform: translate(-50%, -50%) scale(1); }

  /* さいしょのタップうながし */
  #tapToStart {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3vmin;
    background: rgba(255,255,255,0.0);
    z-index: 10;
  }
  #tapToStart .big {
    font-size: clamp(60px, 18vmin, 150px);
    animation: pulse2 1.2s ease-in-out infinite;
  }
  @keyframes pulse2 { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  #tapToStart .msg {
    font-size: clamp(18px, 4.5vmin, 34px);
    font-weight: bold;
    color: #7a6ae0;
    text-shadow: 0 2px 0 #fff;
  }
  #tapToStart.hidden { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="title">ABCで あそぼう!</div>
  <button id="homeBtn" class="btn" aria-label="もどる">🏠</button>
  <button id="nextBtn" class="btn" aria-label="つぎへ">➡️</button>
  <div id="wordLabel"></div>
  <div id="hint">👆</div>
  <div id="star">🌟</div>
</div>
<div id="tapToStart">
  <div class="big">🔤</div>
  <div class="msg">タップして はじめよう!</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
