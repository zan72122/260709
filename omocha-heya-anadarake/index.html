<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おもちゃのへや あなだらけ!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd9a0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕳️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    touch-action: none; overscroll-behavior: none;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", system-ui, sans-serif;
    background: #ffe3b8;
    user-select: none; -webkit-user-select: none;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------- title ---------- */
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    pointer-events: auto; text-align: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  .title-screen { background: radial-gradient(ellipse at 50% 38%, rgba(255,255,255,0.30), rgba(255,190,120,0.45)); }
  .game-title {
    font-size: clamp(30px, 8.4vw, 62px); font-weight: 800; line-height: 1.3; color: #8a5a2b;
    word-break: keep-all;
    text-shadow: 0 3px 0 #fff, 0 7px 20px rgba(180,120,50,0.4);
    animation: bob 2.6s ease-in-out infinite;
  }
  .game-hole {
    font-size: clamp(60px, 17vw, 120px); line-height: 1;
    animation: holespin 5s linear infinite;
    filter: drop-shadow(0 8px 14px rgba(120,70,20,0.4));
  }
  @keyframes holespin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .game-sub { font-size: clamp(15px, 4vw, 23px); color: #a4713a; text-shadow: 0 2px 0 #fff; font-weight: 700; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-10px) rotate(1.2deg); } }

  .big-btn {
    pointer-events: auto; border: none; cursor: pointer;
    font-family: inherit; font-weight: 800;
    font-size: clamp(26px, 7vw, 40px); color: #fff;
    padding: 20px 52px; border-radius: 999px;
    background: linear-gradient(180deg, #ffb25e, #ff8b3d);
    box-shadow: 0 7px 0 #d96b22, 0 14px 26px rgba(220,130,50,0.45);
    transition: transform 0.1s;
  }
  .big-btn:active { transform: translateY(5px) scale(0.97); box-shadow: 0 2px 0 #d96b22; }
  .play-btn { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* ---------- HUD ---------- */
  .hud { position: absolute; inset: 0; pointer-events: none; }
  .hud-top {
    position: absolute; left: 0; right: 0;
    top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: flex-start; gap: 10px;
    padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  }
  .hud-right { margin-left: auto; display: flex; gap: 10px; }
  .icon-btn {
    pointer-events: auto; border: none; cursor: pointer;
    width: 54px; height: 54px; border-radius: 18px; font-size: 27px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 4px 0 rgba(200,150,90,0.65), 0 8px 16px rgba(180,120,60,0.3);
    transition: transform 0.1s;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(200,150,90,0.65); }
  .crown-row {
    display: flex; align-items: center; gap: 2px;
    background: rgba(255,255,255,0.85); border-radius: 999px; padding: 8px 14px;
    font-size: 22px; min-height: 54px;
    box-shadow: 0 4px 12px rgba(180,120,60,0.3);
  }
  .crown-row:empty { display: none; }

  .meter-wrap {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px;
    width: min(56vw, 300px);
    pointer-events: none;
  }
  .meter {
    flex: 1; height: 24px; border-radius: 999px; overflow: hidden;
    background: rgba(255,255,255,0.66);
    box-shadow: inset 0 2px 6px rgba(160,100,40,0.35);
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd36e, #ff9d5c, #ff7ab2);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .meter-icon { font-size: 27px; filter: drop-shadow(0 2px 3px rgba(120,60,0,0.35)); }

  /* launcher button: big, bottom-right, bouncy */
  .launch-btn {
    position: absolute;
    right: max(16px, env(safe-area-inset-right));
    bottom: max(16px, env(safe-area-inset-bottom));
    width: clamp(72px, 17vw, 96px); height: clamp(72px, 17vw, 96px);
    border-radius: 50%; border: none; cursor: pointer;
    font-size: clamp(34px, 8vw, 46px);
    background: radial-gradient(circle at 32% 28%, #9be3ff, #4da3ff 70%);
    box-shadow: 0 7px 0 #2f78cc, 0 14px 26px rgba(60,130,220,0.5);
    pointer-events: auto;
    animation: launchbob 1.4s ease-in-out infinite;
    transition: transform 0.1s;
  }
  .launch-btn:active { transform: translateY(5px) scale(0.94); box-shadow: 0 2px 0 #2f78cc; }
  @keyframes launchbob { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.09) rotate(3deg); } }

  /* tap-hint finger */
  .hint-finger {
    position: absolute; left: 50%; top: 55%;
    font-size: clamp(44px, 11vw, 72px);
    pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(120,60,0,0.4));
    animation: fingertap 1.5s ease-in-out infinite;
  }
  @keyframes fingertap {
    0%, 100% { transform: translate(-50%,-10%) scale(1); opacity: 0.95; }
    30% { transform: translate(-50%, 14%) scale(0.86); opacity: 1; }
    60% { transform: translate(-50%,-10%) scale(1); opacity: 0.95; }
  }

  /* ---------- reset confirm ---------- */
  .confirm-screen { background: rgba(90,60,20,0.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .confirm-card {
    background: #fff; border-radius: 30px; padding: 28px 30px;
    display: flex; flex-direction: column; gap: 20px; align-items: center;
    box-shadow: 0 18px 44px rgba(90,50,10,0.4);
  }
  .confirm-emoji { font-size: clamp(44px, 11vw, 68px); }
  .confirm-row { display: flex; gap: 22px; }
  .confirm-btn {
    pointer-events: auto; border: none; cursor: pointer;
    width: clamp(76px, 18vw, 96px); height: clamp(76px, 18vw, 96px);
    border-radius: 26px; font-size: clamp(34px, 9vw, 46px);
    transition: transform 0.1s;
  }
  .confirm-btn:active { transform: scale(0.92); }
  .confirm-yes { background: linear-gradient(180deg, #8ce99a, #51cf66); box-shadow: 0 6px 0 #37a34a; }
  .confirm-no { background: linear-gradient(180deg, #ffc9c9, #ff8787); box-shadow: 0 6px 0 #d9534f; }

  /* ---------- celebration ---------- */
  .celebrate { background: rgba(255,248,230,0.42); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .celebrate-burst { font-size: clamp(60px, 16vw, 120px); animation: spinpop 0.9s ease-out; }
  .celebrate-crowns { font-size: clamp(34px, 9vw, 56px); letter-spacing: 6px; animation: spinpop 1.2s ease-out; }
  @keyframes spinpop { 0% { transform: scale(0) rotate(-180deg); } 70% { transform: scale(1.25) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script>
  // iOS: block pinch zoom / double-tap zoom inside the game
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
