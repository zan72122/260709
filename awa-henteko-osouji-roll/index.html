<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>あわあわ へんてこ おそうじロール</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fd0ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    touch-action: none; overscroll-behavior: none;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", system-ui, sans-serif;
    background: #8fd0ff;
    user-select: none; -webkit-user-select: none;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    pointer-events: auto; text-align: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  .title-screen { background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0.24), rgba(140,200,255,0.42)); }
  .game-title {
    font-size: clamp(34px, 9vw, 64px); font-weight: 800; line-height: 1.25; color: #2a6f9e;
    word-break: keep-all; white-space: nowrap;
    text-shadow: 0 3px 0 #fff, 0 6px 18px rgba(60,140,200,0.4);
    animation: bob 2.6s ease-in-out infinite;
  }
  .game-sub { font-size: clamp(16px, 4vw, 24px); color: #3d85b8; text-shadow: 0 2px 0 #fff; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-10px) rotate(1.2deg); } }

  .big-btn {
    pointer-events: auto; border: none; cursor: pointer;
    font-family: inherit; font-weight: 800;
    font-size: clamp(22px, 6vw, 34px); color: #fff;
    padding: 18px 46px; border-radius: 999px;
    background: linear-gradient(180deg, #ffa1c0, #ff6d9d);
    box-shadow: 0 6px 0 #d94f7f, 0 12px 24px rgba(220,90,140,0.45);
    transition: transform 0.1s;
  }
  .big-btn:active { transform: translateY(4px) scale(0.97); box-shadow: 0 2px 0 #d94f7f; }
  .play-btn { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  .select-screen { background: rgba(230,246,255,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .select-title { font-size: clamp(24px, 6vw, 40px); font-weight: 800; color: #2a6f9e; text-shadow: 0 2px 0 #fff; }
  .stage-grid {
    display: grid; grid-template-columns: repeat(2, minmax(120px, 240px)); gap: 14px;
    width: min(94vw, 540px);
    max-height: 70vh; overflow-y: auto;
  }
  .stage-card {
    pointer-events: auto; border: none; cursor: pointer; font-family: inherit;
    background: #fff; border-radius: 26px; padding: 16px 12px;
    box-shadow: 0 5px 0 #cfe3ef, 0 10px 22px rgba(90,150,200,0.25);
    transition: transform 0.1s;
  }
  .stage-card:active { transform: scale(0.96); }
  .stage-emoji { font-size: clamp(36px, 8vw, 52px); }
  .stage-name { font-size: clamp(16px, 4vw, 21px); font-weight: 800; color: #35708f; margin-top: 4px; }
  .stage-desc { font-size: clamp(11px, 2.8vw, 14px); color: #7a9ab0; margin-top: 4px; line-height: 1.4; }
  .stage-stars { font-size: 18px; min-height: 24px; }

  .hud { position: absolute; inset: 0; pointer-events: none; }
  .hud-top {
    position: absolute; left: 0; right: 0;
    top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
    padding: 0 max(12px, env(safe-area-inset-left)) 0 max(12px, env(safe-area-inset-right));
  }
  .hud-right { margin-left: auto; display: flex; gap: 10px; }
  .icon-btn {
    pointer-events: auto; border: none; cursor: pointer;
    width: 52px; height: 52px; border-radius: 18px; font-size: 26px;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 4px 0 rgba(140,180,210,0.7), 0 8px 16px rgba(90,150,200,0.3);
    transition: transform 0.1s;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(140,180,210,0.7); }
  .goal-pill {
    background: rgba(255,255,255,0.88); color: #35708f; font-weight: 700;
    font-size: clamp(12px, 3.2vw, 17px);
    padding: 10px 16px; border-radius: 999px;
    box-shadow: 0 4px 12px rgba(90,150,200,0.3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meter-wrap {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px;
    width: min(70vw, 340px);
  }
  .meter {
    flex: 1; height: 22px; border-radius: 999px; overflow: hidden;
    background: rgba(255,255,255,0.65);
    box-shadow: inset 0 2px 6px rgba(60,120,170,0.3);
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #7ae0c3, #4da3ff, #c9a8ff);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .meter-icon { font-size: 26px; filter: drop-shadow(0 2px 3px rgba(0,60,120,0.3)); }

  .hint {
    position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
    background: rgba(255,255,255,0.92); color: #35708f;
    font-size: clamp(15px, 4vw, 20px); font-weight: 800;
    padding: 14px 22px; border-radius: 999px;
    box-shadow: 0 8px 20px rgba(90,150,200,0.4);
    animation: hintbob 1.3s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes hintbob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -12px); } }

  .celebrate { background: rgba(255,250,235,0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .celebrate-burst { font-size: clamp(56px, 15vw, 110px); animation: spinpop 0.9s ease-out; }
  .celebrate-title {
    font-size: clamp(40px, 11vw, 78px); font-weight: 800; color: #ff6d9d;
    text-shadow: 0 3px 0 #fff, 0 8px 22px rgba(255,120,170,0.5);
    animation: bob 1.8s ease-in-out infinite;
  }
  .celebrate-stars { font-size: clamp(30px, 8vw, 52px); letter-spacing: 8px; animation: spinpop 1.2s ease-out; }
  .celebrate-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  @keyframes spinpop { 0% { transform: scale(0) rotate(-180deg); } 70% { transform: scale(1.25) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script>
  // iOS: block pinch zoom / double-tap zoom inside the game
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
