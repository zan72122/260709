<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ねらって！とばして！リラックマ ぐらぐらスイーツタワー</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd9a8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍯</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    touch-action: none; overscroll-behavior: none;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", system-ui, sans-serif;
    background: #ffe3b8;
    user-select: none; -webkit-user-select: none;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  /* ------------------------------------------------ screens */
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    pointer-events: auto; text-align: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  .title-screen {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.35), rgba(255,214,160,0.55)),
      linear-gradient(180deg, rgba(255,236,200,0.5), rgba(255,190,150,0.6));
  }
  .title-bears { font-size: clamp(52px, 15vw, 110px); line-height: 1; animation: bob 2.4s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(160,90,30,0.3)); }
  .game-catch { font-size: clamp(18px, 4.6vw, 28px); color: #b06a20; font-weight: 800; text-shadow: 0 2px 0 #fff; }
  .game-title {
    font-size: clamp(30px, 8vw, 58px); font-weight: 800; line-height: 1.3; color: #8a4d12;
    word-break: keep-all;
    text-shadow: 0 3px 0 #fff, 0 8px 22px rgba(200,120,40,0.35);
  }
  .game-title .pink { color: #ff5f8f; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.4deg); } 50% { transform: translateY(-12px) rotate(1.4deg); } }
  .title-best { font-size: clamp(15px, 3.6vw, 21px); color: #a06a2c; font-weight: 700; text-shadow: 0 1px 0 #fff; }
  .title-hint { font-size: clamp(13px, 3.2vw, 17px); color: #ad7a3d; }

  .big-btn {
    pointer-events: auto; border: none; cursor: pointer;
    font-family: inherit; font-weight: 800;
    font-size: clamp(24px, 6.5vw, 36px); color: #fff;
    padding: 20px 52px; border-radius: 999px;
    background: linear-gradient(180deg, #ffb257, #ff8b2e);
    box-shadow: 0 7px 0 #d96f14, 0 14px 26px rgba(220,130,40,0.45);
    transition: transform 0.1s;
  }
  .big-btn:active { transform: translateY(5px) scale(0.97); box-shadow: 0 2px 0 #d96f14; }
  .big-btn.pink { background: linear-gradient(180deg, #ffa1c0, #ff6d9d); box-shadow: 0 7px 0 #d94f7f, 0 14px 26px rgba(220,90,140,0.45); }
  .big-btn.pink:active { box-shadow: 0 2px 0 #d94f7f; }
  .big-btn.small { font-size: clamp(17px, 4.5vw, 24px); padding: 13px 34px; }

  .mute-btn {
    pointer-events: auto; border: none; cursor: pointer; font-family: inherit;
    width: 52px; height: 52px; border-radius: 50%;
    font-size: 26px; line-height: 1;
    background: rgba(255,255,255,0.85); box-shadow: 0 3px 0 rgba(180,120,60,0.4);
  }
  .mute-btn:active { transform: translateY(2px); }
  .corner-mute { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); }

  /* ------------------------------------------------ HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .hud-top-left {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
    background: rgba(255,255,255,0.82); border-radius: 20px; padding: 8px 18px;
    box-shadow: 0 3px 10px rgba(170,110,50,0.25);
  }
  .height-label { font-size: 13px; color: #a06a2c; font-weight: 700; }
  .height-value { font-size: clamp(26px, 6.5vw, 38px); font-weight: 800; color: #ff7a1f; line-height: 1.05; }
  .height-value small { font-size: 0.5em; color: #c98a3d; }
  #best-line { font-size: 12px; color: #b98a4d; font-weight: 700; }

  .hud-top-right {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    display: flex; align-items: center; gap: 10px;
  }
  #hearts { display: flex; gap: 2px; background: rgba(255,255,255,0.82); border-radius: 18px; padding: 8px 12px; box-shadow: 0 3px 10px rgba(170,110,50,0.25); }
  .heart { font-size: 22px; transition: filter 0.4s, opacity 0.4s, transform 0.4s; }
  .heart.lost { filter: grayscale(1); opacity: 0.35; transform: scale(0.85); }

  #next-box {
    position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: rgba(255,255,255,0.85); border-radius: 20px; padding: 8px 16px;
    box-shadow: 0 3px 10px rgba(170,110,50,0.25);
  }
  .next-label { font-size: 12px; color: #a06a2c; font-weight: 700; }
  .next-emoji { font-size: 34px; line-height: 1.15; }
  .next-name { font-size: 12px; color: #8a5a22; font-weight: 700; }

  .tap-hint {
    position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: clamp(15px, 4vw, 20px); font-weight: 800; color: #fff;
    background: rgba(255,140,60,0.85); padding: 10px 22px; border-radius: 999px;
    box-shadow: 0 4px 12px rgba(200,110,30,0.4);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.07); } }

  /* combo + banner */
  #combo-pop {
    position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0) scale(0);
    font-size: clamp(22px, 6vw, 34px); font-weight: 800; color: #ff4f8f;
    text-shadow: 0 2px 0 #fff, 0 6px 14px rgba(255,90,140,0.4);
    white-space: nowrap;
  }
  #combo-pop.show { animation: combo-in 1.4s ease forwards; }
  @keyframes combo-in {
    0% { transform: translate(-50%,0) scale(0); opacity: 0; }
    18% { transform: translate(-50%,0) scale(1.25); opacity: 1; }
    30% { transform: translate(-50%,0) scale(1); }
    80% { opacity: 1; }
    100% { transform: translate(-50%,-18px) scale(1); opacity: 0; }
  }
  #banner {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(0);
    text-align: center; padding: 16px 30px; border-radius: 26px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 8px 28px rgba(190,110,40,0.35);
    opacity: 0; white-space: nowrap;
  }
  #banner.show { animation: banner-in 2.4s ease forwards; }
  @keyframes banner-in {
    0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    12% { transform: translate(-50%,-50%) scale(1.06); opacity: 1; }
    20% { transform: translate(-50%,-50%) scale(1); }
    85% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-56%) scale(0.96); }
  }
  .banner-main { font-size: clamp(22px, 6vw, 34px); font-weight: 800; color: #ff7a1f; }
  .banner-sub { font-size: clamp(13px, 3.6vw, 18px); font-weight: 700; color: #a06a2c; margin-top: 4px; }

  /* judge pops */
  #pops { position: absolute; inset: 0; overflow: hidden; }
  .pop {
    position: absolute; transform: translate(-50%, -50%);
    font-weight: 800; font-size: clamp(20px, 5.5vw, 30px); white-space: nowrap;
    text-shadow: 0 2px 0 #fff, 0 5px 12px rgba(120,70,20,0.35);
    animation: pop-fly 1.3s ease forwards;
  }
  .pop-perfect { color: #ff9d00; font-size: clamp(24px, 6.5vw, 38px); }
  .pop-good { color: #3fae5c; }
  .pop-edge { color: #ff6d3d; }
  .pop-miss { color: #7f8fc9; }
  .pop-rescue { color: #ffb800; }
  @keyframes pop-fly {
    0% { transform: translate(-50%,-50%) scale(0.4); opacity: 0; }
    15% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
    28% { transform: translate(-50%,-50%) scale(1); }
    75% { opacity: 1; }
    100% { transform: translate(-50%, calc(-50% - 46px)) scale(1); opacity: 0; }
  }

  /* speech bubbles */
  #bubbles { position: absolute; inset: 0; overflow: hidden; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%);
    background: #fff; color: #8a5a22; font-weight: 800;
    font-size: clamp(13px, 3.4vw, 17px);
    padding: 8px 14px; border-radius: 16px; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(150,90,30,0.3);
    animation: bubble-in 0.25s ease;
  }
  .bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
    border: 8px solid transparent; border-top-color: #fff; border-bottom: none;
  }
  .bubble.out { opacity: 0; transition: opacity 0.3s; }
  @keyframes bubble-in { from { transform: translate(-50%, -80%) scale(0.6); opacity: 0; } }

  /* steady overlay */
  #steady-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: max(90px, 16vh);
    background: radial-gradient(ellipse at center, transparent 40%, rgba(255,90,60,0.18));
    animation: steady-flash 0.5s ease-in-out infinite;
  }
  @keyframes steady-flash { 0%,100% { opacity: 1; } 50% { opacity: 0.75; } }
  .steady-text {
    font-size: clamp(26px, 7.5vw, 44px); font-weight: 800; color: #ff4326;
    text-shadow: 0 3px 0 #fff, 0 8px 18px rgba(255,80,40,0.45);
    animation: steady-shake 0.3s linear infinite;
  }
  @keyframes steady-shake { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
  .steady-sub { font-size: clamp(16px, 4.4vw, 24px); font-weight: 800; color: #b0400f; text-shadow: 0 2px 0 #fff; margin-top: 6px; }
  .steady-bar {
    width: min(70vw, 340px); height: 18px; margin-top: 14px;
    background: rgba(255,255,255,0.8); border-radius: 999px; overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(150,60,20,0.3);
  }
  #steady-fill { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffd24d, #ff5f3d); transition: width 0.12s; }

  /* ------------------------------------------------ finish screen */
  .finish-screen { background: rgba(90,55,20,0.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .finish-card {
    background: linear-gradient(180deg, #fffdf6, #fff3dd);
    border-radius: 30px; padding: 22px 26px;
    width: min(92vw, 430px); max-height: 88vh; overflow-y: auto;
    box-shadow: 0 14px 40px rgba(90,50,10,0.4);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: auto;
  }
  #fin-title { font-size: clamp(22px, 6vw, 32px); font-weight: 800; color: #ff7a1f; }
  #fin-stars { display: flex; gap: 8px; font-size: clamp(34px, 9vw, 48px); }
  .fin-star { filter: grayscale(1); opacity: 0.3; transform: scale(0.8); }
  .fin-star.lit { animation: star-in 0.5s ease forwards; }
  @keyframes star-in {
    0% { filter: grayscale(1); opacity: 0.3; transform: scale(0.6); }
    60% { transform: scale(1.4) rotate(12deg); }
    100% { filter: none; opacity: 1; transform: scale(1); }
  }
  #fin-stats { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .fin-row {
    display: flex; justify-content: space-between; align-items: baseline;
    background: rgba(255,210,150,0.35); border-radius: 12px; padding: 7px 16px;
    font-size: clamp(14px, 4vw, 18px); font-weight: 700; color: #8a5a22;
  }
  .fin-row b { font-size: 1.25em; color: #ff7a1f; }
  .zukan-title { font-size: clamp(14px, 4vw, 18px); font-weight: 800; color: #a06a2c; margin-top: 2px; }
  #fin-zukan {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; width: 100%;
  }
  .zukan-cell {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: #fff; border-radius: 12px; padding: 6px 2px;
    box-shadow: 0 2px 6px rgba(170,110,50,0.18);
  }
  .zukan-cell.locked { opacity: 0.45; }
  .zukan-cell.new { outline: 3px solid #ffc94d; animation: new-glow 1s ease-in-out infinite; }
  @keyframes new-glow { 0%,100% { outline-color: #ffc94d; } 50% { outline-color: #ff8b2e; } }
  .z-emoji { font-size: 24px; line-height: 1.2; }
  .z-name { font-size: 9px; font-weight: 700; color: #8a5a22; text-align: center; }
  .fin-btns { display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }

  /* narrow portrait: lift the next-sweet box above the tap hint */
  @media (max-width: 560px) {
    #next-box { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <!-- ---------------- HUD ---------------- -->
  <div id="hud" class="hidden">
    <div class="hud-top-left">
      <div class="height-label">たかさ</div>
      <div class="height-value"><span id="height-num">0</span> <small>cm</small></div>
      <div id="best-line"></div>
    </div>
    <div class="hud-top-right">
      <div id="hearts"></div>
      <button class="mute-btn">🔊</button>
    </div>
    <div id="next-box"></div>
    <div class="tap-hint">タップで とばそう！</div>
    <div id="combo-pop"></div>
    <div id="banner"></div>
    <div id="pops"></div>
    <div id="bubbles"></div>
    <div id="steady-overlay" class="hidden">
      <div class="steady-text">ぐらぐら〜！！</div>
      <div class="steady-sub">いっぱい タップして おさえて！</div>
      <div class="steady-bar"><div id="steady-fill"></div></div>
    </div>
  </div>

  <!-- ---------------- title ---------------- -->
  <div id="title-screen" class="screen title-screen">
    <div class="title-bears">🐻🍯🐤</div>
    <div class="game-catch">ねらって！とばして！</div>
    <div class="game-title">リラックマ<br><span class="pink">ぐらぐら</span>スイーツタワー</div>
    <button id="start-btn" class="big-btn">▶ あそぶ！</button>
    <div id="title-best" class="title-best"></div>
    <div class="title-hint">まとの わっかを めがけて スイーツを とばして<br>たか〜い タワーを つくろう！</div>
    <button class="mute-btn corner-mute">🔊</button>
  </div>

  <!-- ---------------- finish ---------------- -->
  <div id="finish-screen" class="screen finish-screen hidden">
    <div class="finish-card">
      <div id="fin-title">よくがんばりました！</div>
      <div id="fin-stars"></div>
      <div id="fin-stats"></div>
      <div class="zukan-title">📖 スイーツずかん</div>
      <div id="fin-zukan"></div>
      <div class="fin-btns">
        <button id="retry-btn" class="big-btn pink small">もういっかい！</button>
        <button id="home-btn" class="big-btn small">おうちへ</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
