<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>コロコロからくり</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffdfc2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    touch-action: none; overscroll-behavior: none;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", system-ui, sans-serif;
    background: #ffdfc2;
    user-select: none; -webkit-user-select: none;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------- タイトル ---------- */
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    pointer-events: auto; text-align: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at 50% 36%, rgba(255,255,255,0.35), rgba(255,205,150,0.55));
    transition: opacity .6s ease;
  }
  .screen.fade-out { opacity: 0; pointer-events: none; }
  .game-title {
    font-size: clamp(30px, 8vw, 64px); font-weight: 800; line-height: 1.3; color: #6b3a15;
    -webkit-text-stroke: 1px rgba(107,58,21,.55);
    text-shadow: 0 3px 0 #fff, 0 10px 24px rgba(160,100,40,.45);
    animation: bob 2.8s ease-in-out infinite;
  }
  .game-title .deco { font-size: 1.1em; }
  .game-sub {
    font-size: clamp(15px, 4vw, 22px); color: #96683c; text-shadow: 0 2px 0 #fff;
    line-height: 1.7;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  .big-btn {
    pointer-events: auto; border: none; cursor: pointer;
    font-family: inherit; font-weight: 800;
    font-size: clamp(22px, 5.5vw, 34px); color: #fff;
    padding: 18px 52px; border-radius: 999px;
    background: linear-gradient(180deg, #f0a24e, #d97e2a);
    box-shadow: 0 6px 0 #a85c17, 0 12px 24px rgba(160,100,40,.4), inset 0 2px 0 rgba(255,255,255,.5);
    text-shadow: 0 2px 2px rgba(120,70,20,.4);
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a85c17, 0 6px 12px rgba(160,100,40,.35); }

  /* ---------- HUD ボタン ---------- */
  #hud {
    position: absolute; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0 max(10px, env(safe-area-inset-left)) 0 max(10px, env(safe-area-inset-right));
    pointer-events: none;
  }
  .hud-group { display: flex; gap: 10px; }
  .hud-btn {
    pointer-events: auto; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-width: 64px; min-height: 60px; padding: 6px 12px;
    border-radius: 18px; font-family: inherit;
    background: linear-gradient(180deg, #fdf3e0, #f2ddb9);
    box-shadow: 0 4px 0 #c9a273, 0 8px 16px rgba(150,100,50,.25), inset 0 1px 0 #fff;
    color: #7c4a24; font-weight: 800; font-size: 12px;
  }
  .hud-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9a273, 0 4px 8px rgba(150,100,50,.2); }
  .hud-btn .icon { font-size: 24px; line-height: 1.1; }
  .hud-btn.off { filter: grayscale(.9) brightness(.92); }

  /* ---------- ふきだし ---------- */
  #bubble {
    position: absolute; left: 0; top: 0;
    margin-left: 14px; margin-top: -54px;
    background: #fff; color: #4f3418;
    font-weight: 800; font-size: clamp(15px, 3.6vw, 21px);
    padding: 10px 16px; border-radius: 18px;
    border: 3px solid #f0a24e;
    box-shadow: 0 6px 16px rgba(150,100,50,.3);
    white-space: nowrap; pointer-events: none;
    animation: bubblePulse 1.4s ease-in-out infinite;
  }
  #bubble::after {
    content: ''; position: absolute; left: 18px; bottom: -12px;
    border: 7px solid transparent; border-top-color: #f0a24e;
  }
  #bubble.flip { margin-left: -14px; translate: -100% 0; }
  #bubble.flip::after { left: auto; right: 18px; }
  @keyframes bubblePulse { 0%,100% { scale: 1 } 50% { scale: 1.05 } }

  /* ---------- やったーバナー ---------- */
  #banner {
    position: absolute; left: 50%; top: 34%;
    translate: -50% -50%;
    font-size: clamp(44px, 12vw, 96px); font-weight: 800;
    color: #ff8b4a;
    text-shadow: 0 4px 0 #fff, 0 0 30px rgba(255,220,120,.9), 0 14px 30px rgba(200,110,30,.45);
    pointer-events: none; white-space: nowrap;
  }
  #banner.pop { animation: bannerPop 1s cubic-bezier(.2,2.2,.4,1) both, bannerWiggle 1.6s ease-in-out .9s infinite; }
  @keyframes bannerPop { from { scale: 0; rotate: -12deg } to { scale: 1; rotate: 0deg } }
  @keyframes bannerWiggle { 0%,100% { rotate: -2deg } 50% { rotate: 2deg } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div class="hud-group">
      <button id="btn-guide" class="hud-btn" type="button">
        <span class="icon">👉</span><span class="label">ガイド ON</span>
      </button>
    </div>
    <div class="hud-group">
      <button id="btn-mute" class="hud-btn" type="button">
        <span class="icon">🔊</span><span class="label">おと</span>
      </button>
      <button id="btn-reset" class="hud-btn" type="button">
        <span class="icon">🔁</span><span class="label">たまを もどす</span>
      </button>
    </div>
  </div>
  <div id="bubble" class="hidden">ここを タップ!</div>
  <div id="banner" class="hidden">🎉 やったー! 🎉</div>
  <div id="title-screen" class="screen">
    <div class="game-title"><span class="deco">🎡</span> コロコロからくり</div>
    <div class="game-sub">タップと ながおしで<br>たまを ゴールまで はこぼう!</div>
    <button id="btn-start" class="big-btn" type="button">はじめる</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
