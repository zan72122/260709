<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ころころ びーだまワールド</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fd0ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    touch-action: none; overscroll-behavior: none;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", system-ui, sans-serif;
    background: #8fd0ff;
    user-select: none; -webkit-user-select: none;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------- title screen ---------- */
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    pointer-events: auto; text-align: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .title-screen {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(180deg, rgba(121,196,255,0.55) 0%, rgba(165,220,255,0.35) 45%, rgba(255,233,242,0.55) 100%);
  }
  .game-title {
    font-size: clamp(32px, 8.5vw, 62px); font-weight: 800; line-height: 1.3; color: #2a6f9e;
    word-break: keep-all;
    text-shadow: 0 3px 0 #fff, 0 8px 22px rgba(70,140,220,0.35);
    animation: bob 2.8s ease-in-out infinite;
  }
  .game-sub { font-size: clamp(15px, 3.8vw, 22px); color: #4585b3; text-shadow: 0 2px 0 #fff; margin-bottom: 6px; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-9px) rotate(1deg); } }

  .marble-row { font-size: clamp(26px, 7vw, 44px); letter-spacing: 6px; animation: roll 5s linear infinite; }
  @keyframes roll { 0% { transform: translateX(-12px); } 50% { transform: translateX(12px); } 100% { transform: translateX(-12px); } }

  .course-cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .course-card {
    pointer-events: auto; border: none; cursor: pointer; font-family: inherit;
    width: clamp(104px, 27vw, 150px); padding: 16px 8px 13px;
    border-radius: 26px; background: linear-gradient(180deg, #ffffff, #eaf6ff);
    box-shadow: 0 6px 0 rgba(120,170,220,0.55), 0 14px 26px rgba(90,140,200,0.3);
    transition: transform 0.12s;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
  }
  .course-card:active { transform: translateY(4px) scale(0.96); box-shadow: 0 2px 0 rgba(120,170,220,0.55); }
  .course-card .emo { font-size: clamp(38px, 10vw, 58px); line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18)); }
  .course-card .nm { font-size: clamp(13px, 3.4vw, 17px); font-weight: 800; color: #35719c; line-height: 1.35; word-break: keep-all; }
  .course-card:nth-child(2) { background: linear-gradient(180deg, #fff7ef, #ffe6d2); }
  .course-card:nth-child(2) .nm { color: #b06a3c; }
  .course-card:nth-child(3) { background: linear-gradient(180deg, #fff2f8, #ffdcee); }
  .course-card:nth-child(3) .nm { color: #c25a8e; }
  .title-hint { font-size: clamp(13px, 3.4vw, 17px); color: #4585b3; text-shadow: 0 1px 0 #fff; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .chip {
    position: absolute; pointer-events: auto; border: none; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.88); backdrop-filter: blur(6px);
    border-radius: 999px; box-shadow: 0 4px 0 rgba(130,160,200,0.4), 0 8px 18px rgba(80,120,180,0.25);
    transition: transform 0.1s;
  }
  .chip:active { transform: scale(0.92) translateY(2px); box-shadow: 0 1px 0 rgba(130,160,200,0.4); }
  .btn-round { width: clamp(52px, 13vw, 64px); height: clamp(52px, 13vw, 64px); font-size: clamp(24px, 6.5vw, 32px); }

  #btn-home  { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); }
  #btn-sound { top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
  #btn-cam   { right: max(12px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + clamp(120px, 26vw, 150px)); }

  #counter {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.88); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 8px 18px;
    font-size: clamp(16px, 4.4vw, 22px); font-weight: 800; color: #35719c;
    box-shadow: 0 4px 0 rgba(130,160,200,0.4), 0 8px 18px rgba(80,120,180,0.25);
    display: flex; gap: 14px; align-items: center; white-space: nowrap;
  }
  #counter .stars { color: #d9930f; }
  #counter.bump { animation: bump 0.35s ease; }
  @keyframes bump { 0% { transform: translateX(-50%) scale(1); } 35% { transform: translateX(-50%) scale(1.18); } 100% { transform: translateX(-50%) scale(1); } }

  #btn-pour {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: max(18px, env(safe-area-inset-bottom));
    pointer-events: auto; border: none; cursor: pointer; font-family: inherit;
    width: clamp(104px, 24vw, 136px); height: clamp(104px, 24vw, 136px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd1e2, #ff6d9d 70%);
    box-shadow: 0 8px 0 #d94f7f, 0 16px 30px rgba(220,90,140,0.5), inset 0 -6px 12px rgba(200,60,110,0.35);
    color: #fff; font-weight: 800; font-size: clamp(15px, 3.8vw, 20px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform 0.1s;
    animation: pulse 2.2s ease-in-out infinite;
  }
  #btn-pour .emo { font-size: clamp(34px, 8.5vw, 46px); line-height: 1; filter: drop-shadow(0 3px 4px rgba(160,30,80,0.4)); }
  #btn-pour:active, #btn-pour.holding { transform: translateX(-50%) scale(0.93) translateY(4px); box-shadow: 0 3px 0 #d94f7f, 0 8px 16px rgba(220,90,140,0.5); animation: none; }
  @keyframes pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }

  #btn-burst {
    left: max(14px, env(safe-area-inset-left));
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + clamp(120px, 26vw, 150px));
    width: clamp(58px, 14vw, 72px); height: clamp(58px, 14vw, 72px);
    font-size: clamp(26px, 7vw, 34px);
    background: radial-gradient(circle at 35% 30%, #fff3c9, #ffc94d 75%);
    box-shadow: 0 4px 0 #d99a1f, 0 8px 18px rgba(220,160,40,0.4);
  }
  #btn-burst:active { box-shadow: 0 1px 0 #d99a1f; }

  /* landscape: move pour button to the right thumb zone */
  @media (orientation: landscape) and (max-height: 540px) {
    #btn-pour {
      left: auto; right: calc(max(16px, env(safe-area-inset-right)) + 4px);
      transform: none;
      bottom: max(16px, env(safe-area-inset-bottom));
    }
    #btn-pour:active, #btn-pour.holding { transform: scale(0.93) translateY(4px); }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    #btn-cam { right: auto; left: max(14px, env(safe-area-inset-left)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 84px); }
    #btn-burst { bottom: max(16px, env(safe-area-inset-bottom)); }
  }

  /* toast for star milestones */
  #toast {
    position: absolute; top: 22%; left: 50%; transform: translateX(-50%) scale(0);
    font-size: clamp(30px, 8vw, 52px); font-weight: 800; color: #fff;
    text-shadow: 0 3px 0 #e8a020, 0 8px 24px rgba(230,150,30,0.55);
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { animation: toast 1.6s ease forwards; }
  @keyframes toast {
    0% { transform: translateX(-50%) scale(0) rotate(-6deg); opacity: 0; }
    25% { transform: translateX(-50%) scale(1.15) rotate(2deg); opacity: 1; }
    45% { transform: translateX(-50%) scale(1) rotate(0); }
    80% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) scale(1.1); opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <!-- title -->
  <div id="title" class="screen title-screen">
    <div class="marble-row">🔴🟡🟢🔵🟣</div>
    <h1 class="game-title">ころころ<br>びーだまワールド</h1>
    <p class="game-sub">びーだまを ながして あそぼう!</p>
    <div class="course-cards">
      <button class="course-card" data-course="sora"><span class="emo">🏰</span><span class="nm">そらの<br>らせんとう</span></button>
      <button class="course-card" data-course="niji"><span class="emo">🌈</span><span class="nm">にじの<br>おやま</span></button>
      <button class="course-card" data-course="okashi"><span class="emo">🍭</span><span class="nm">おかしの<br>くに</span></button>
    </div>
    <p class="title-hint">すきな コースを えらんでね</p>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <button id="btn-home" class="chip btn-round" aria-label="ホーム">🏠</button>
    <button id="btn-sound" class="chip btn-round" aria-label="おと">🔊</button>
    <div id="counter"><span class="stars">⭐ <span id="star-n">0</span></span><span class="goals">🔮 <span id="goal-n">0</span></span></div>
    <button id="btn-cam" class="chip btn-round" aria-label="カメラ">👀</button>
    <button id="btn-burst" class="chip" aria-label="いっぱい">🎉</button>
    <button id="btn-pour"><span class="emo">🔮</span><span>ころころ!</span></button>
    <div id="toast"></div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
